
services:
  db:
    image: postgres:16-alpine
    container_name: developer_portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: developer_portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_dev_password
    ports:
      - "5435:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d developer_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portfolio_postgres_data:
