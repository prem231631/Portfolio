
services:
  db:
    image: postgres:16-alpine
    container_name: developer_portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: developer_portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_dev_password
    ports:
      - "5435:5432"
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d developer_portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: developer_portfolio_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://portfolio_user:portfolio_dev_password@db:5432/developer_portfolio
      FRONTEND_URL: http://localhost:8081
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    container_name: developer_portfolio_frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  portfolio_postgres_data:
    name: developerportfolio_portfolio_postgres_data
